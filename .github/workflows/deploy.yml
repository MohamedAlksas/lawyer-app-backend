name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        env:
          RENDER_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -n "$RENDER_KEY" ]; then
            curl -X POST "https://api.render.com/v1/services/srv-d8d339ojs32c73f4qjd0/deploys" \
              -H "Authorization: Bearer $RENDER_KEY" \
              -H "Content-Type: application/json" \
              -d '{}'
          fi
